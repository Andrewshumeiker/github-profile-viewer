services:
  - type: web
    name: andrewshumeiker-github-profile-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /user/Andrewshumeiker
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: FRONTEND_URL
        value: https://andrewshumeiker-github-profile.onrender.com

  - type: web
    name: andrewshumeiker-github-profile
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NEXT_PUBLIC_API_URL
        value: https://andrewshumeiker-github-profile-api.onrender.com
      - key: NEXT_PUBLIC_DEFAULT_USERNAME
        value: Andrewshumeiker
